---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: ephemeralenvironments.ephemeral.elementor.io
  labels:
    app.kubernetes.io/name: ephemeral-operator
    app.kubernetes.io/part-of: ephemeral-envs
spec:
  group: ephemeral.elementor.io
  scope: Cluster
  names:
    plural: ephemeralenvironments
    singular: ephemeralenvironment
    kind: EphemeralEnvironment
    shortNames:
      - ephemenv
      - ee
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Namespace
          type: string
          jsonPath: .status.namespace
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: Expires
          type: date
          jsonPath: .status.expiresAt
        - name: Owner
          type: string
          jsonPath: .spec.owner
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [ingress]
              properties:
                ttl:
                  type: string
                  default: "24h"
                database:
                  type: object
                  properties:
                    mode:
                      type: string
                      enum: [shared, fresh]
                      default: shared
                ingress:
                  type: object
                  required: [domain]
                  properties:
                    domain:
                      type: string
                      minLength: 1
                    entrypointRefs:
                      type: array
                      items:
                        type: string
                    tlsSecretName:
                      type: string
                includeCoreApps:
                  type: boolean
                  default: true
                owner:
                  type: string
                resources:
                  type: object
                  properties:
                    cpu:
                      type: string
                    memory:
                      type: string
                    pods:
                      type: string
                pause:
                  type: boolean
            status:
              type: object
              properties:
                phase:
                  type: string
                namespace:
                  type: string
                rootURL:
                  type: string
                expiresAt:
                  type: string
                  format: date-time
                services:
                  type: array
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      phase:
                        type: string
                      url:
                        type: string
                      message:
                        type: string
                observedGeneration:
                  type: integer
                  format: int64
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      observedGeneration:
                        type: integer
                        format: int64
                    required: [type, status, reason, message, lastTransitionTime]
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: ephemeralservices.ephemeral.elementor.io
  labels:
    app.kubernetes.io/name: ephemeral-operator
    app.kubernetes.io/part-of: ephemeral-envs
spec:
  group: ephemeral.elementor.io
  scope: Cluster
  names:
    plural: ephemeralservices
    singular: ephemeralservice
    kind: EphemeralService
    shortNames:
      - ephemsvc
      - esvc
  versions:
    - name: v1alpha1
      served: true
      storage: true
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Environment
          type: string
          jsonPath: .spec.environmentRef
        - name: Service
          type: string
          jsonPath: .spec.serviceName
        - name: Phase
          type: string
          jsonPath: .status.phase
        - name: URL
          type: string
          jsonPath: .status.url
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required: [environmentRef, serviceName, image, source]
              properties:
                environmentRef:
                  type: string
                  minLength: 1
                serviceName:
                  type: string
                  minLength: 1
                  pattern: ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$
                image:
                  type: object
                  required: [repository, tag]
                  properties:
                    repository:
                      type: string
                    tag:
                      type: string
                    helmRepositoryKey:
                      type: string
                      default: global.image.repository
                    helmTagKey:
                      type: string
                      default: global.image.tag
                source:
                  type: object
                  required: [repoURL, path]
                  properties:
                    repoURL:
                      type: string
                    path:
                      type: string
                    targetRevision:
                      type: string
                      default: master
                    chart:
                      type: string
                valuesYAML:
                  type: string
                argoCDProject:
                  type: string
                  default: ephemeral
                argoCDNamespace:
                  type: string
                  default: argocd
                core:
                  type: boolean
            status:
              type: object
              properties:
                phase:
                  type: string
                url:
                  type: string
                argoCDApp:
                  type: string
                syncStatus:
                  type: string
                healthStatus:
                  type: string
                observedGeneration:
                  type: integer
                  format: int64
                conditions:
                  type: array
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      reason:
                        type: string
                      message:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      observedGeneration:
                        type: integer
                        format: int64
                    required: [type, status, reason, message, lastTransitionTime]
                  x-kubernetes-list-type: map
                  x-kubernetes-list-map-keys: [type]
