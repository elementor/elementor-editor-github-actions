name: Post-release verify
description: Verify published Core/Pro GitHub releases, changelog on main, wordpress.org, and zip version headers.

inputs:
    core-version:
        description: 'Core version to verify (e.g. 4.2.2).'
        required: true
    pro-version:
        description: 'Pro version to verify. Leave empty for Core-only.'
        required: false
        default: ''
    github-token:
        description: 'GitHub token. Use a PAT with repo access for private Pro releases.'
        required: true
    skip-wordpress-org:
        description: 'Skip wordpress.org SVN/download checks (use when the .org tag is not published yet).'
        required: false
        default: 'false'
    dry-run:
        description: 'Collect failures in the job summary without failing the step.'
        required: false
        default: 'false'

outputs:
    core-zip-path:
        description: 'Absolute path to the downloaded Core zip.'
    pro-zip-path:
        description: 'Absolute path to the downloaded Pro zip, if requested.'
    failed:
        description: 'Whether any hard checks failed (true/false).'

runs:
    using: node20
    main: ./dist/index.js
