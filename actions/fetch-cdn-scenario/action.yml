name: Fetch CDN Scenario
description: Fetch live editor-assets CDN data and set up mock CDN infrastructure for Playwright tests

inputs:
    cdn-source:
        description: 'CDN source URL or local directory to fetch from (default: https://assets.elementor.com)'
        required: false
        default: 'https://assets.elementor.com'
    allow-failure:
        description: 'Allow WordPress to start even if CDN fetch fails (default: false)'
        required: false
        default: 'false'
    output-dir:
        description: 'Target directory for fetched CDN files (required)'
        required: true
    mu-plugins-dir:
        description: 'Target directory for the mock CDN mu-plugin (optional, if you want to copy the mu-plugin)'
        required: false
        default: ''
    copy-fixtures:
        description: 'Copy the shared no-promotion fixtures to the fixtures directory (default: true)'
        required: false
        default: 'true'

runs:
    using: composite
    steps:
        - name: Fetch CDN scenario
          shell: bash
          env:
              ACTION_PATH: ${{ github.action_path }}
              CDN_SOURCE: ${{ inputs.cdn-source }}
              ALLOW_FAILURE: ${{ inputs.allow-failure }}
              OUTPUT_DIR: ${{ inputs.output-dir }}
          run: |
              ALLOW_FAILURE_FLAG=""
              if [ "$ALLOW_FAILURE" = "true" ]; then
                ALLOW_FAILURE_FLAG="--allow-failure"
              fi

              FROM_FLAG="--from=$CDN_SOURCE"

              node "$ACTION_PATH/fetch-cdn-scenario.mjs" \
                --output="$OUTPUT_DIR" \
                $FROM_FLAG \
                $ALLOW_FAILURE_FLAG

        - name: Copy mock CDN mu-plugin
          if: inputs.mu-plugins-dir != ''
          shell: bash
          env:
              ACTION_PATH: ${{ github.action_path }}
              MU_PLUGINS_DIR: ${{ inputs.mu-plugins-dir }}
          run: |
              mkdir -p "$MU_PLUGINS_DIR"
              cp "$ACTION_PATH/mock-editor-assets-cdn.php" "$MU_PLUGINS_DIR/"
              echo "Copied mock-editor-assets-cdn.php to $MU_PLUGINS_DIR"

        - name: Copy shared no-promotion fixtures
          if: inputs.copy-fixtures == 'true'
          shell: bash
          env:
              ACTION_PATH: ${{ github.action_path }}
              OUTPUT_DIR: ${{ inputs.output-dir }}
          run: |
              FIXTURES_BASE=$(dirname "$OUTPUT_DIR")
              mkdir -p "$FIXTURES_BASE/no-promotion"
              cp -r "$ACTION_PATH/fixtures/no-promotion/"* "$FIXTURES_BASE/no-promotion/"
              echo "Copied shared no-promotion fixtures to $FIXTURES_BASE/no-promotion"
