name: Check release owner
description: Fails unless the user who triggered the run is a required reviewer of the given environment.

inputs:
    environment:
        description: 'Environment whose required reviewers may start a release.'
        required: false
        default: 'release-owners'
    github-token:
        description: 'Token that can read the environment. The workflow token needs actions: read.'
        required: false
        default: ${{ github.token }}

runs:
    using: 'composite'
    steps:
        - name: Check release owner
          shell: bash
          env:
              GH_TOKEN: ${{ inputs.github-token }}
              ENVIRONMENT: ${{ inputs.environment }}
              REPOSITORY: ${{ github.repository }}
              ACTOR: ${{ github.triggering_actor }}
          run: bash "${GITHUB_ACTION_PATH}/check-release-owner.sh"
