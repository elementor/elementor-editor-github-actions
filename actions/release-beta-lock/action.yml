name: Release Beta Lock
description: >-
    Locks or unlocks the beta release branch for merges by toggling a dedicated repository ruleset
    with an "update" rule. The ruleset is created on first run.
    Requires a token with repository Administration write permission; GITHUB_TOKEN is not sufficient.

inputs:
    token:
        description: Token with repository Administration write permission (PAT or GitHub App token)
        required: true
    state:
        description: 'Target state: "locked" or "unlocked"'
        required: true
    branch:
        description: Branch to lock or unlock
        required: false
        default: release/beta
    ruleset-name:
        description: Name of the ruleset that holds the lock
        required: false
        default: Release beta lock

runs:
    using: composite
    steps:
        - name: Apply lock state
          shell: bash
          env:
              GH_TOKEN: ${{ inputs.token }}
              STATE: ${{ inputs.state }}
              BRANCH: ${{ inputs.branch }}
              RULESET_NAME: ${{ inputs.ruleset-name }}
          run: bash "${{ github.action_path }}/release-beta-lock.sh"
