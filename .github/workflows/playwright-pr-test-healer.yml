name: Playwright PR Test Healer

# Reusable: Elementor Core and Pro each call this from a thin workflow of
# their own that runs when the `heal` label is added to a pull request, and
# passes `product` and the PR number.
#
# For every Playwright test that failed in the PR's latest run it gives one
# verdict, with a reason and evidence, in a single comment on the PR:
#
#   Broken by this PR       The failure is linked to the PR's diff: its spec,
#                           a file it imports, its snapshots, the module it
#                           covers, or a selector the PR changes. Never re-run
#                           and never "fixed".
#   Flaky                   Not linked, and it passed at least one of three
#                           re-runs on the PR's build. A Cloud agent fixes it
#                           on main, the fix is verified on a main build, and
#                           the fixes go out as one PR against main, never to
#                           the PR's branch.
#   Already failing on main Failed every re-run here and every run on main.
#   Needs a human look      Failed every re-run here but not on main, or the
#                           healer could not finish checking it.
#
# Linked failures are decided from the diff before anything runs, so a real
# regression is never re-run into looking flaky.
#
# The caller's job must grant contents: write (the fix PR's branch),
# actions: read, and pull-requests: write, and pass its secrets. Only PRs
# from branches of the calling repository are healed: the re-runs execute
# the PR's code next to the Pro licence.
#
# Healer scripts are always checked out from this workflow's own commit
# (job.workflow_repository at job.workflow_sha), never from the PR.
#
# Repository variables the caller's repo can set:
#   TEST_HEALER_ENABLED        off (default) refuses; manual or all heal PRs.
#   NIGHTLY_HEALER_PR_ASSIGNEE Assigned to the fix PR.

on:
    workflow_call:
        inputs:
            product:
                description: 'Which repository is calling: core or pro.'
                required: true
                type: string
            pr_number:
                description: 'The pull request to heal.'
                required: true
                type: string
            label:
                description: 'The label that started the run. It is removed when the run ends, so adding it again starts a new one.'
                required: false
                type: string
                default: 'heal'
            rerun_repeat:
                description: 'How many times each unlinked failure is re-run, on the PR build and on main.'
                required: false
                type: string
                default: '3'
            max_reruns:
                description: 'The most failures re-run per PR. The rest are reported as needing a human look.'
                required: false
                type: string
                default: '20'
            max_fixes:
                description: 'The most flaky tests an agent is sent to fix per PR.'
                required: false
                type: string
                default: '5'
            verify_repeat:
                description: 'How many runs in a row a fix must pass on main.'
                required: false
                type: string
                default: '10'
            jira_parent_key:
                description: 'Jira key the fix PR title carries.'
                required: false
                type: string
                default: 'ED-22856'
            slack_channel:
                description: 'Slack channel ID the fix PR is announced in. Empty posts nothing.'
                required: false
                type: string
                default: ''
        secrets:
            CURSOR_APIKEY:
                description: 'Cursor Cloud Agents API key, for the flaky fixes.'
                required: false
            E2E_PRO_LICENSE:
                description: "Pro only: licence the Playwright environment activates. Pass a non-production one: the PR's and the agent's test code run in the jobs that activate it."
                required: false
            SLACK_TOKEN:
                description: 'Slack bot token for slack_channel. The bot must be a member of that channel.'
                required: false

permissions:
    contents: read

env:
    HEALER_PRODUCT: ${{ inputs.product }}
    HEALER_DIR: .healer/actions/playwright-test-healer
    HEALER_NODE_VERSION: '24'
    FIX_LABEL: test-healer-pr

jobs:
    resolve-input:
        name: Resolve input
        runs-on: ubuntu-22.04
        permissions:
            contents: read
            pull-requests: read
        outputs:
            enabled: ${{ steps.set.outputs.enabled }}
            state: ${{ steps.pr.outputs.state || steps.set.outputs.state }}
            head_sha: ${{ steps.pr.outputs.head_sha }}
            head_repository: ${{ steps.pr.outputs.head_repository }}
            base_sha: ${{ steps.pr.outputs.base_sha }}
            base_ref: ${{ steps.pr.outputs.base_ref }}
            pr_url: ${{ steps.pr.outputs.pr_url }}
            main_sha: ${{ steps.pr.outputs.main_sha }}
        steps:
            - name: Validate inputs and check the switch
              id: set
              env:
                  PR_NUMBER: ${{ inputs.pr_number }}
                  RERUN_REPEAT: ${{ inputs.rerun_repeat }}
                  MAX_RERUNS: ${{ inputs.max_reruns }}
                  MAX_FIXES: ${{ inputs.max_fixes }}
                  VERIFY_REPEAT: ${{ inputs.verify_repeat }}
                  HEALER_SWITCH: ${{ vars.TEST_HEALER_ENABLED }}
              run: |
                  set -euo pipefail

                  case "${HEALER_PRODUCT}" in
                    core|pro) ;;
                    *)
                      echo "::error::product must be core or pro, got '${HEALER_PRODUCT}'."
                      exit 1
                      ;;
                  esac

                  if ! [[ "$PR_NUMBER" =~ ^[1-9][0-9]*$ ]]; then
                    echo "::error::pr_number must be a PR number, got '${PR_NUMBER}'."
                    exit 1
                  fi
                  if ! [[ "$RERUN_REPEAT" =~ ^[1-9]$ ]]; then
                    echo "::error::rerun_repeat must be 1-9, got '${RERUN_REPEAT}'."
                    exit 1
                  fi
                  for N in "$MAX_RERUNS" "$MAX_FIXES" "$VERIFY_REPEAT"; do
                    if ! [[ "$N" =~ ^[0-9]{1,2}$ ]]; then
                      echo "::error::max_reruns, max_fixes and verify_repeat must be 0-99, got '${N}'."
                      exit 1
                    fi
                  done

                  # A person added the label, so `manual` is enough: the PR healer is
                  # never scheduled.
                  SWITCH="$(printf '%s' "${HEALER_SWITCH:-off}" | tr '[:upper:]' '[:lower:]')"
                  case "$SWITCH" in
                    manual|all) ENABLED=true ;;
                    off|'') ENABLED=false ;;
                    *)
                      echo "::error::vars.TEST_HEALER_ENABLED must be one of off, manual, all — got '${HEALER_SWITCH}'."
                      exit 1
                      ;;
                  esac

                  echo "enabled=$ENABLED" >> "$GITHUB_OUTPUT"
                  if [ "$ENABLED" != "true" ]; then
                    echo "state=disabled" >> "$GITHUB_OUTPUT"
                  fi
                  echo "PR #${PR_NUMBER}; switch: ${SWITCH}; enabled: ${ENABLED}"

            # A fork's code is not run with the licence, and its run gets no
            # write token to comment with anyway.
            - name: Read the PR
              id: pr
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  PR_NUMBER: ${{ inputs.pr_number }}
              run: |
                  set -euo pipefail
                  PR=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")
                  HEAD_REPOSITORY=$(jq -r '.head.repo.full_name // ""' <<< "$PR")

                  {
                    echo "head_sha=$(jq -r '.head.sha' <<< "$PR")"
                    echo "head_repository=${HEAD_REPOSITORY}"
                    echo "base_sha=$(jq -r '.base.sha' <<< "$PR")"
                    echo "base_ref=$(jq -r '.base.ref' <<< "$PR")"
                    echo "pr_url=$(jq -r '.html_url' <<< "$PR")"
                    echo "main_sha=$(gh api "repos/${GITHUB_REPOSITORY}/commits/main" --jq '.sha')"
                  } >> "$GITHUB_OUTPUT"

                  if [ "$HEAD_REPOSITORY" != "$GITHUB_REPOSITORY" ]; then
                    echo "::notice::PR #${PR_NUMBER} comes from ${HEAD_REPOSITORY:-a deleted fork}; the healer only runs on this repository's branches."
                    echo "state=fork" >> "$GITHUB_OUTPUT"
                  fi

    # Reads the PR run's failures and decides which the diff explains. Nothing
    # from the PR runs here: its checkout is only read.
    collect:
        name: Collect and triage failures
        needs: [resolve-input]
        if: needs.resolve-input.outputs.enabled == 'true' && needs.resolve-input.outputs.state == ''
        runs-on: ubuntu-22.04
        permissions:
            contents: read
            actions: read
            pull-requests: read
        outputs:
            found: ${{ steps.run.outputs.found }}
            source_run_id: ${{ steps.run.outputs.source_run_id }}
            source_run_url: ${{ steps.run.outputs.source_run_url }}
            failure_count: ${{ steps.failures.outputs.failure_count }}
            rerun_tests: ${{ steps.triage.outputs.rerun_tests }}
            over_limit: ${{ steps.triage.outputs.over_limit }}
            has_reruns: ${{ steps.triage.outputs.has_reruns }}
        steps:
            - name: Check out the healer
              uses: actions/checkout@v6
              with:
                  repository: ${{ job.workflow_repository }}
                  ref: ${{ job.workflow_sha }}
                  path: .healer
                  sparse-checkout: actions/playwright-test-healer
                  persist-credentials: false
            - uses: actions/setup-node@v6
              with:
                  node-version: ${{ env.HEALER_NODE_VERSION }}

            - name: Find the PR's Playwright run
              id: run
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  PR_HEAD_SHA: ${{ needs.resolve-input.outputs.head_sha }}
                  PR_HEAD_REPOSITORY: ${{ needs.resolve-input.outputs.head_repository }}
                  HEALER_RUN_ID: ${{ github.run_id }}
              run: node "$HEALER_DIR/scripts/find-pr-playwright-run.js"

            - name: Download the merged Allure report
              id: allure
              if: steps.run.outputs.found == 'true'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  SOURCE_RUN_ID: ${{ steps.run.outputs.source_run_id }}
              run: |
                  set -euo pipefail

                  # The report is kept for 1 day; an older run is read from its job logs.
                  if ! gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts" --paginate \
                      --jq '.artifacts[] | select(.expired == false) | .name' | grep -qx 'allure-report'; then
                    echo "::notice::Run ${SOURCE_RUN_ID} has no unexpired allure-report artifact — reading failures from job logs."
                    exit 0
                  fi

                  gh run download "${SOURCE_RUN_ID}" --repo "${GITHUB_REPOSITORY}" -n allure-report -D allure-report

            - name: Collect hard failures from job logs
              if: steps.run.outputs.found == 'true' && hashFiles('allure-report/data/suites.json') == ''
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  SOURCE_RUN_ID: ${{ steps.run.outputs.source_run_id }}
              run: node "$HEALER_DIR/scripts/collect-log-hard-failures.js"

            - name: Download the failed shards' test results
              if: steps.run.outputs.found == 'true'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  SOURCE_RUN_ID: ${{ steps.run.outputs.source_run_id }}
              run: |
                  set -euo pipefail
                  mkdir -p test-results

                  NAMES=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}/artifacts" --paginate \
                    --jq '.artifacts[] | select(.expired == false) | select(.name | startswith("playwright-test-results-")) | .name')

                  for NAME in $NAMES; do
                    gh run download "${SOURCE_RUN_ID}" --repo "${GITHUB_REPOSITORY}" -n "$NAME" -D "test-results/$NAME" || true
                  done

            - name: Collect the failures
              id: failures
              if: steps.run.outputs.found == 'true'
              run: node "$HEALER_DIR/scripts/collect-pr-failures.js"

            - name: Check out the PR head
              if: steps.failures.outputs.failure_count != '0' && steps.failures.outputs.failure_count != ''
              uses: actions/checkout@v6
              with:
                  ref: ${{ needs.resolve-input.outputs.head_sha }}
                  path: pr
                  persist-credentials: false

            - name: List the PR's changed files
              if: steps.failures.outputs.failure_count != '0' && steps.failures.outputs.failure_count != ''
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  PR_NUMBER: ${{ inputs.pr_number }}
              run: |
                  set -euo pipefail
                  gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}/files?per_page=100" --paginate \
                    --jq '.[] | {filename, previous_filename, status, patch}' | jq -s . > pr-files.json
                  echo "The PR changes $(jq length pr-files.json) file(s)."

            - name: Triage against the PR's changes
              id: triage
              if: steps.failures.outputs.failure_count != '0' && steps.failures.outputs.failure_count != ''
              env:
                  PR_CHECKOUT_DIR: pr
                  PR_TRIAGE_PATH: healer-data/pr-triage.json
                  MAX_RERUNS: ${{ inputs.max_reruns }}
              run: |
                  mkdir -p healer-data
                  node "$HEALER_DIR/scripts/triage-pr-failures.js"

            - uses: actions/upload-artifact@v7
              if: steps.triage.outcome == 'success'
              with:
                  name: pr-healer-triage
                  path: healer-data/pr-triage.json
                  retention-days: 7

    # Builds the PR head and main where no secret is held and nothing is
    # cached, since the PR's own build scripts run here. Pro gets the Core
    # nightly for the branch, as its PR runs do.
    prepare-builds:
        name: Build ${{ matrix.target }}
        needs: [resolve-input, collect]
        if: needs.collect.outputs.has_reruns == 'true'
        runs-on: ubuntu-22.04
        permissions:
            contents: read
        strategy:
            fail-fast: false
            matrix:
                target: [pr, main]
        steps:
            - uses: actions/checkout@v6
              with:
                  ref: ${{ matrix.target == 'pr' && needs.resolve-input.outputs.head_sha || needs.resolve-input.outputs.main_sha }}
                  persist-credentials: false

            - name: Check out the healer
              uses: actions/checkout@v6
              with:
                  repository: ${{ job.workflow_repository }}
                  ref: ${{ job.workflow_sha }}
                  path: .healer
                  sparse-checkout: |
                      actions/playwright-test-healer
                      actions/resolve-core-nightly
                  persist-credentials: false

            - uses: actions/setup-node@v6
              with:
                  node-version-file: .nvmrc

            - name: Install PHP for the build
              uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # v2
              with:
                  php-version: '7.4'

            - name: Fetch the Core nightly
              if: inputs.product == 'pro'
              uses: ./.healer/actions/resolve-core-nightly
              with:
                  core-branch: ${{ matrix.target == 'pr' && needs.resolve-input.outputs.base_ref || 'main' }}
                  token: ${{ github.token }}
                  zip-path: elementor.zip

            - name: Build Pro
              if: inputs.product == 'pro'
              env:
                  ELEMENTOR_CORE_BRANCH: ${{ matrix.target == 'pr' && needs.resolve-input.outputs.base_ref || 'main' }}
              run: |
                  set -euo pipefail
                  unzip -qo elementor.zip
                  bash ./.github/scripts/clone-core.sh
                  (cd ../elementor && npm run install:ci && npm run composer:no-dev)
                  PACKAGE_VERSION=$(node -p "require('./package.json').version") bash ./.github/scripts/build-zip.sh
                  rm -rf ../elementor
                  test -d elementor-pro && test -d elementor

            - name: Build Core
              if: inputs.product == 'core'
              run: |
                  set -euo pipefail
                  npm run install:ci
                  npm run composer:no-dev
                  npm run build
                  test -f build/elementor.php

            - name: Package the build
              run: |
                  set -euo pipefail
                  if [ "$HEALER_PRODUCT" = "core" ]; then
                    tar -czf "$RUNNER_TEMP/healer-builds.tgz" build
                  else
                    tar -czf "$RUNNER_TEMP/healer-builds.tgz" elementor elementor-pro elementor.zip
                  fi

            - uses: actions/upload-artifact@v7
              with:
                  name: healer-builds-${{ matrix.target }}
                  path: ${{ runner.temp }}/healer-builds.tgz
                  if-no-files-found: error
                  retention-days: 1

    # Runs the PR's code with the licence, as its own PR run does.
    rerun-on-pr:
        name: Re-run on the PR build
        needs: [resolve-input, collect, prepare-builds]
        if: always() && needs.collect.outputs.has_reruns == 'true'
        runs-on: ubuntu-22.04
        timeout-minutes: 150
        permissions:
            contents: read
        outputs:
            flaky_tests: ${{ steps.rerun.outputs.flaky_tests }}
            has_flaky: ${{ steps.rerun.outputs.has_flaky }}
            failed_every_run: ${{ steps.rerun.outputs.failed_every_run }}
            has_failed_every_run: ${{ steps.rerun.outputs.has_failed_every_run }}
        steps:
            - uses: actions/checkout@v6
              with:
                  ref: ${{ needs.resolve-input.outputs.head_sha }}
                  persist-credentials: false

            - name: Check out the healer
              uses: actions/checkout@v6
              with:
                  repository: ${{ job.workflow_repository }}
                  ref: ${{ job.workflow_sha }}
                  path: .healer
                  sparse-checkout: actions/playwright-test-healer
                  persist-credentials: false

            - uses: actions/download-artifact@v8
              with:
                  name: healer-builds-pr
                  path: ${{ runner.temp }}/healer-builds

            - name: Unpack the build
              run: tar -xzf "$RUNNER_TEMP/healer-builds/healer-builds.tgz"

            - uses: actions/setup-node@v6
              with:
                  node-version-file: .nvmrc

            - name: Set up the Pro Playwright environment
              if: inputs.product == 'pro'
              timeout-minutes: 30
              env:
                  E2E_PRO_LICENSE: ${{ secrets.E2E_PRO_LICENSE }}
              run: bash "$HEALER_DIR/scripts/setup-pro-playwright.sh"

            - name: Set up the Core Playwright environment
              if: inputs.product == 'core'
              timeout-minutes: 30
              run: bash "$HEALER_DIR/scripts/setup-core-playwright.sh"

            - name: Re-run the failures
              id: rerun
              env:
                  RERUN_TESTS: ${{ needs.collect.outputs.rerun_tests }}
                  RERUN_REPEAT: ${{ inputs.rerun_repeat }}
              run: |
                  set -euo pipefail
                  mkdir -p "$RUNNER_TEMP/healer-data"
                  printf '%s' "$RERUN_TESTS" > "$RUNNER_TEMP/rerun-tests.json"
                  RERUN_TESTS_PATH="$RUNNER_TEMP/rerun-tests.json" \
                  RERUN_RESULTS_PATH="$RUNNER_TEMP/healer-data/pr-rerun.json" \
                    node "$HEALER_DIR/scripts/rerun-pr-failures.js"

            - uses: actions/upload-artifact@v7
              if: steps.rerun.outcome == 'success'
              with:
                  name: pr-healer-rerun-pr
                  path: ${{ runner.temp }}/healer-data/pr-rerun.json
                  retention-days: 7

            # Evidence for the agent: how the flaky tests behaved on re-run.
            - uses: actions/upload-artifact@v7
              if: always()
              with:
                  name: healer-rerun-test-results
                  path: test-results/
                  if-no-files-found: ignore
                  retention-days: 3

    rerun-on-main:
        name: Check on main
        needs: [resolve-input, collect, prepare-builds, rerun-on-pr]
        if: always() && needs.rerun-on-pr.outputs.has_failed_every_run == 'true'
        runs-on: ubuntu-22.04
        timeout-minutes: 150
        permissions:
            contents: read
        steps:
            - uses: actions/checkout@v6
              with:
                  ref: ${{ needs.resolve-input.outputs.main_sha }}
                  persist-credentials: false

            - name: Check out the healer
              uses: actions/checkout@v6
              with:
                  repository: ${{ job.workflow_repository }}
                  ref: ${{ job.workflow_sha }}
                  path: .healer
                  sparse-checkout: actions/playwright-test-healer
                  persist-credentials: false

            - uses: actions/download-artifact@v8
              with:
                  name: healer-builds-main
                  path: ${{ runner.temp }}/healer-builds

            - name: Unpack the build
              run: tar -xzf "$RUNNER_TEMP/healer-builds/healer-builds.tgz"

            - uses: actions/setup-node@v6
              with:
                  node-version-file: .nvmrc

            - name: Set up the Pro Playwright environment
              if: inputs.product == 'pro'
              timeout-minutes: 30
              env:
                  E2E_PRO_LICENSE: ${{ secrets.E2E_PRO_LICENSE }}
              run: bash "$HEALER_DIR/scripts/setup-pro-playwright.sh"

            - name: Set up the Core Playwright environment
              if: inputs.product == 'core'
              timeout-minutes: 30
              run: bash "$HEALER_DIR/scripts/setup-core-playwright.sh"

            # The spec paths are the PR's; main may have the test elsewhere, so
            # only the title selects it here.
            - name: Run the hard failures on main
              id: rerun
              env:
                  RERUN_TESTS: ${{ needs.rerun-on-pr.outputs.failed_every_run }}
                  RERUN_REPEAT: ${{ inputs.rerun_repeat }}
              run: |
                  set -euo pipefail
                  mkdir -p "$RUNNER_TEMP/healer-data"
                  printf '%s' "$RERUN_TESTS" | jq 'map(.specFiles = [])' > "$RUNNER_TEMP/rerun-tests.json"
                  RERUN_TESTS_PATH="$RUNNER_TEMP/rerun-tests.json" \
                  RERUN_RESULTS_PATH="$RUNNER_TEMP/healer-data/main-rerun.json" \
                    node "$HEALER_DIR/scripts/rerun-pr-failures.js"

            - uses: actions/upload-artifact@v7
              if: steps.rerun.outcome == 'success'
              with:
                  name: pr-healer-rerun-main
                  path: ${{ runner.temp }}/healer-data/main-rerun.json
                  retention-days: 7

    plan-fixes:
        name: Plan the flaky fixes
        needs: [resolve-input, rerun-on-pr]
        if: always() && needs.rerun-on-pr.outputs.has_flaky == 'true'
        runs-on: ubuntu-22.04
        permissions:
            contents: read
            pull-requests: read
        outputs:
            fix_matrix: ${{ steps.plan.outputs.fix_matrix }}
            has_fixes: ${{ steps.plan.outputs.has_fixes }}
        steps:
            - name: Check out the healer
              uses: actions/checkout@v6
              with:
                  repository: ${{ job.workflow_repository }}
                  ref: ${{ job.workflow_sha }}
                  path: .healer
                  sparse-checkout: actions/playwright-test-healer
                  persist-credentials: false
            - uses: actions/setup-node@v6
              with:
                  node-version: ${{ env.HEALER_NODE_VERSION }}

            - name: List open PRs into main
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  gh pr list --repo "$GITHUB_REPOSITORY" --state open --base main --limit 500 \
                    --json number,url,title,body,headRefName,baseRefName > "$RUNNER_TEMP/open-prs.json"

            - name: Plan
              id: plan
              env:
                  FLAKY_TESTS: ${{ needs.rerun-on-pr.outputs.flaky_tests }}
                  MAX_FIXES: ${{ inputs.max_fixes }}
              run: |
                  set -euo pipefail
                  mkdir -p "$RUNNER_TEMP/healer-data"
                  printf '%s' "$FLAKY_TESTS" > "$RUNNER_TEMP/flaky-tests.json"
                  FLAKY_TESTS_PATH="$RUNNER_TEMP/flaky-tests.json" \
                  OPEN_PRS_PATH="$RUNNER_TEMP/open-prs.json" \
                  FIX_SKIPS_PATH="$RUNNER_TEMP/healer-data/fix-skips.json" \
                    node "$HEALER_DIR/scripts/pr-healer-report.js" plan-fixes

            - uses: actions/upload-artifact@v7
              with:
                  name: pr-healer-fix-skips
                  path: ${{ runner.temp }}/healer-data/fix-skips.json
                  retention-days: 7

    # One agent per flaky test, each on its own branch off main. Nothing from
    # the agent runs here: this job holds the Cursor key.
    fix-agent:
        name: Fix ${{ matrix.fix.testName }}
        needs: [resolve-input, collect, plan-fixes]
        if: always() && needs.plan-fixes.outputs.has_fixes == 'true'
        runs-on: ubuntu-22.04
        permissions:
            contents: read
        strategy:
            fail-fast: false
            matrix:
                fix: ${{ fromJSON(needs.plan-fixes.outputs.fix_matrix) }}
        steps:
            - name: Check out the healer
              uses: actions/checkout@v6
              with:
                  repository: ${{ job.workflow_repository }}
                  ref: ${{ job.workflow_sha }}
                  path: .healer
                  sparse-checkout: actions/playwright-test-healer
                  persist-credentials: false
            - uses: actions/setup-node@v6
              with:
                  node-version: ${{ env.HEALER_NODE_VERSION }}

            - name: Compute branch name
              id: branch
              env:
                  TEST_NAME: ${{ matrix.fix.testName }}
                  PR_NUMBER: ${{ inputs.pr_number }}
                  RUN_ID: ${{ github.run_id }}
                  FIX_INDEX: ${{ matrix.fix.index }}
              run: |
                  set -euo pipefail
                  node -e "
                    const { buildHealBranchSlug } = require('./' + process.env.HEALER_DIR + '/scripts/healer-skips');
                    const { PR_NUMBER, RUN_ID, FIX_INDEX, TEST_NAME } = process.env;
                    process.stdout.write('branch_name=heal/pr-' + PR_NUMBER + '-' + buildHealBranchSlug(TEST_NAME) + '-' + RUN_ID + '-' + FIX_INDEX + '\n');
                  " >> "$GITHUB_OUTPUT"

            - name: Dispatch
              id: dispatch
              continue-on-error: true
              env:
                  CURSOR_API_KEY: ${{ secrets.CURSOR_APIKEY }}
                  GITHUB_REPOSITORY: ${{ github.repository }}
                  HEAL_TEST_NAME: ${{ matrix.fix.testName }}
                  HEAL_RUN_URL: ${{ needs.collect.outputs.source_run_url }}
                  HEAL_BRANCH_NAME: ${{ steps.branch.outputs.branch_name }}
                  HEAL_SHARD_INDEX: ${{ matrix.fix.shardIndex }}
                  HEAL_MATCHED_DIRS: ${{ matrix.fix.matchedDirs }}
                  HEAL_STARTING_REF: main
                  HEAL_ATTEMPT: '1'
                  HEAL_MAX_ATTEMPTS: '1'
                  HEAL_CONTEXT: >-
                      This test failed on pull request ${{ needs.resolve-input.outputs.pr_url }}, in the evidence run above, then passed
                      ${{ matrix.fix.passed }} of ${{ matrix.fix.runs }} re-runs on that PR's build with no change, so the PR healer judged
                      it flaky rather than broken by that PR. Fix the flake on main: the PR's changes are not on your branch and are not
                      yours to change. The healer's re-run results are in the artifact "healer-rerun-test-results" on
                      run ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}.
              run: node "$HEALER_DIR/scripts/dispatch-cloud-agent.js"

            - name: Poll
              id: poll
              if: steps.dispatch.outcome == 'success'
              continue-on-error: true
              env:
                  CURSOR_API_KEY: ${{ secrets.CURSOR_APIKEY }}
                  HEAL_AGENT_ID: ${{ steps.dispatch.outputs.agent_id }}
                  HEAL_AGENT_RUN_ID: ${{ steps.dispatch.outputs.run_id }}
                  HEAL_BRANCH_NAME: ${{ steps.branch.outputs.branch_name }}
                  HEAL_BASE_REF: main
                  GITHUB_REPOSITORY: ${{ github.repository }}
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: node "$HEALER_DIR/scripts/poll-cloud-agent-run.js"

            - name: Record the agent's outcome
              if: always()
              env:
                  TEST_NAME: ${{ matrix.fix.testName }}
                  STATUS: ${{ steps.poll.outputs.status || (steps.dispatch.outcome == 'failure' && 'DISPATCH_FAILED') || '' }}
                  BRANCH: ${{ steps.poll.outputs.branch }}
                  RESULT_TEXT: ${{ steps.poll.outputs.result_text }}
                  HANDOFF: ${{ steps.poll.outputs.handoff }}
                  FIX_INDEX: ${{ matrix.fix.index }}
              run: |
                  set -euo pipefail
                  mkdir -p "$RUNNER_TEMP/healer-data"
                  jq -n \
                    --arg testName "$TEST_NAME" --arg status "$STATUS" --arg branch "$BRANCH" \
                    --arg resultText "$RESULT_TEXT" --arg handoff "$HANDOFF" \
                    '{testName: $testName, status: $status, branch: $branch, resultText: $resultText, handoff: $handoff}' \
                    > "$RUNNER_TEMP/healer-data/agent-${FIX_INDEX}.json"

            - uses: actions/upload-artifact@v7
              if: always()
              with:
                  name: pr-healer-agent-${{ matrix.fix.index }}
                  path: ${{ runner.temp }}/healer-data/agent-${{ matrix.fix.index }}.json
                  retention-days: 7

    # Runs the agent's branch against a fresh main build, so it holds only the
    # Pro licence (a non-production one) and a read token.
    verify-fix:
        name: Verify ${{ matrix.fix.testName }}
        needs: [resolve-input, prepare-builds, plan-fixes, fix-agent]
        if: always() && needs.plan-fixes.outputs.has_fixes == 'true'
        runs-on: ubuntu-22.04
        timeout-minutes: 120
        permissions:
            contents: read
        strategy:
            fail-fast: false
            matrix:
                fix: ${{ fromJSON(needs.plan-fixes.outputs.fix_matrix) }}
        steps:
            - uses: actions/download-artifact@v8
              id: agent-record
              continue-on-error: true
              with:
                  name: pr-healer-agent-${{ matrix.fix.index }}
                  path: ${{ runner.temp }}/agent

            - name: Read the agent's branch
              id: agent
              env:
                  FIX_INDEX: ${{ matrix.fix.index }}
              run: |
                  set -euo pipefail
                  FILE="$RUNNER_TEMP/agent/agent-${FIX_INDEX}.json"
                  BRANCH=$( [ -f "$FILE" ] && jq -r '.branch // ""' "$FILE" || true )
                  if [ -n "$BRANCH" ] && { ! [[ "$BRANCH" =~ ^heal/[A-Za-z0-9._/-]+$ ]] || [[ "$BRANCH" == *..* ]]; }; then
                    echo "::error::Unexpected branch name '${BRANCH}'."
                    BRANCH=""
                  fi
                  echo "branch=${BRANCH}" >> "$GITHUB_OUTPUT"

            - uses: actions/checkout@v6
              if: steps.agent.outputs.branch != ''
              with:
                  ref: ${{ steps.agent.outputs.branch }}
                  fetch-depth: 0
                  persist-credentials: false

            - name: Check out the healer
              if: steps.agent.outputs.branch != ''
              uses: actions/checkout@v6
              with:
                  repository: ${{ job.workflow_repository }}
                  ref: ${{ job.workflow_sha }}
                  path: .healer
                  sparse-checkout: actions/playwright-test-healer
                  persist-credentials: false

            - name: Enforce fix scope
              id: scope
              if: steps.agent.outputs.branch != ''
              continue-on-error: true
              env:
                  BASE_REF: main
              run: |
                  set -euo pipefail
                  echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
                  node "$HEALER_DIR/scripts/check-fix-scope.js"

            - name: Resolve the shard's run command
              id: cmd
              if: steps.scope.outcome == 'success'
              env:
                  HEAL_TEST_NAME: ${{ matrix.fix.testName }}
                  HEAL_SHARD_INDEX: ${{ matrix.fix.shardIndex }}
              run: node "$HEALER_DIR/scripts/resolve-shard-command.js"

            - uses: actions/download-artifact@v8
              id: download-builds
              if: steps.scope.outcome == 'success'
              continue-on-error: true
              with:
                  name: healer-builds-main
                  path: ${{ runner.temp }}/healer-builds

            - name: Unpack the build
              id: builds
              if: steps.download-builds.outcome == 'success'
              continue-on-error: true
              run: tar -xzf "$RUNNER_TEMP/healer-builds/healer-builds.tgz"

            - uses: actions/setup-node@v6
              id: setup-node
              if: steps.builds.outcome == 'success'
              continue-on-error: true
              with:
                  node-version-file: .nvmrc

            - name: Set up the Pro Playwright environment
              id: setup-pro
              if: inputs.product == 'pro' && steps.setup-node.outcome == 'success'
              continue-on-error: true
              timeout-minutes: 30
              env:
                  E2E_PRO_LICENSE: ${{ secrets.E2E_PRO_LICENSE }}
              run: bash "$HEALER_DIR/scripts/setup-pro-playwright.sh"

            - name: Set up the Core Playwright environment
              id: setup-core
              if: inputs.product == 'core' && steps.setup-node.outcome == 'success'
              continue-on-error: true
              timeout-minutes: 30
              run: bash "$HEALER_DIR/scripts/setup-core-playwright.sh"

            - name: Run the shard's test setup
              id: shard-setup
              if: (steps.setup-pro.outcome == 'success' || steps.setup-core.outcome == 'success') && steps.cmd.outputs.requires_test_setup == 'true'
              continue-on-error: true
              env:
                  TEST_SETUP_SCRIPT: ${{ steps.cmd.outputs.test_setup_script }}
              run: npm run "$TEST_SETUP_SCRIPT"

            # A green run proves nothing if the grep matched no test, or more
            # than this one.
            - name: Confirm the grep matches exactly one test
              id: grep-check
              if: (steps.setup-pro.outcome == 'success' || steps.setup-core.outcome == 'success') && steps.shard-setup.outcome != 'failure'
              continue-on-error: true
              env:
                  NPM_SCRIPT: ${{ steps.cmd.outputs.npm_script }}
                  GREP_PATTERN: ${{ steps.cmd.outputs.grep_pattern }}
              run: |
                  set -euo pipefail
                  npm run "$NPM_SCRIPT" -- --grep="$GREP_PATTERN" --list > "$RUNNER_TEMP/playwright-list.txt" 2>&1 || true
                  cat "$RUNNER_TEMP/playwright-list.txt"
                  TOTAL=$(node -e "
                    const { parsePlaywrightListTotal } = require('./' + process.env.HEALER_DIR + '/scripts/resolve-shard-command');
                    const total = parsePlaywrightListTotal(require('fs').readFileSync(process.argv[1], 'utf8'));
                    process.stdout.write(total === null ? 'none' : String(total));
                  " "$RUNNER_TEMP/playwright-list.txt")
                  if [ "$TOTAL" != "1" ]; then
                    echo "::error::Expected the grep to match exactly 1 test, matched '${TOTAL}'."
                    exit 1
                  fi

            - name: Run the test with the fix
              id: run-test
              if: steps.grep-check.outcome == 'success'
              continue-on-error: true
              env:
                  NPM_SCRIPT: ${{ steps.cmd.outputs.npm_script }}
                  GREP_PATTERN: ${{ steps.cmd.outputs.grep_pattern }}
                  HEAL_TEST_NAME: ${{ matrix.fix.testName }}
                  SCOPE: test
                  TEST_FILE: ''
                  FIX_REPEAT: ${{ inputs.verify_repeat }}
                  E2E_PRO_PLAN: ${{ steps.cmd.outputs.pro_plan }}
              run: node "$HEALER_DIR/scripts/run-healer-attempts.js" verify

            - name: Record the result
              if: always()
              env:
                  TEST_NAME: ${{ matrix.fix.testName }}
                  FIX_INDEX: ${{ matrix.fix.index }}
                  BRANCH: ${{ steps.agent.outputs.branch }}
                  SHA: ${{ steps.scope.outputs.sha }}
                  SCOPE: ${{ steps.scope.outcome }}
                  RESTORE: ${{ steps.builds.outcome }}
                  SETUP_PRO: ${{ steps.setup-pro.outcome }}
                  SETUP_CORE: ${{ steps.setup-core.outcome }}
                  SHARD_SETUP: ${{ steps.shard-setup.outcome }}
                  GREP_CHECK: ${{ steps.grep-check.outcome }}
                  RUN_TEST: ${{ steps.run-test.outcome }}
                  RUN_TEST_INFRA_ERROR: ${{ steps.run-test.outputs.infra_error }}
              run: |
                  set -euo pipefail
                  PASSED=false
                  if [ -z "$BRANCH" ]; then
                    STAGE="agent"
                  elif [ "$SCOPE" != "success" ]; then
                    STAGE="scope"
                  elif [ "$RESTORE" != "success" ]; then
                    STAGE="restore"
                  elif { [ "$SETUP_PRO" != "success" ] && [ "$SETUP_CORE" != "success" ]; } || [ "$SHARD_SETUP" = "failure" ]; then
                    STAGE="setup"
                  elif [ "$GREP_CHECK" != "success" ]; then
                    STAGE="grep"
                  elif [ "$RUN_TEST_INFRA_ERROR" = "true" ]; then
                    STAGE="verify-run"
                  elif [ "$RUN_TEST" != "success" ]; then
                    STAGE="test"
                  else
                    STAGE=""
                    PASSED=true
                  fi

                  mkdir -p "$RUNNER_TEMP/healer-data"
                  jq -n \
                    --arg testName "$TEST_NAME" --arg branch "$BRANCH" --arg sha "$SHA" \
                    --arg passed "$PASSED" --arg stage "$STAGE" \
                    '{testName: $testName, branch: $branch, sha: $sha, passed: $passed, stage: $stage}' \
                    > "$RUNNER_TEMP/healer-data/verify-${FIX_INDEX}.json"
                  echo "Verification passed=$PASSED stage=${STAGE:-none}"

            - uses: actions/upload-artifact@v7
              if: always()
              with:
                  name: pr-healer-verify-${{ matrix.fix.index }}
                  path: ${{ runner.temp }}/healer-data/verify-${{ matrix.fix.index }}.json
                  retention-days: 7

    open-fix-pr:
        name: Open the flaky-fix PR
        needs: [resolve-input, collect, plan-fixes, verify-fix]
        if: always() && needs.plan-fixes.outputs.has_fixes == 'true'
        runs-on: ubuntu-22.04
        permissions:
            contents: write
            pull-requests: write
        outputs:
            fix_pr_url: ${{ steps.open.outputs.fix_pr_url }}
        steps:
            - uses: actions/checkout@v6
              with:
                  ref: main
                  fetch-depth: 0

            - name: Check out the healer
              uses: actions/checkout@v6
              with:
                  repository: ${{ job.workflow_repository }}
                  ref: ${{ job.workflow_sha }}
                  path: .healer
                  sparse-checkout: actions/playwright-test-healer
                  persist-credentials: false
            - uses: actions/setup-node@v6
              with:
                  node-version: ${{ env.HEALER_NODE_VERSION }}

            - uses: actions/download-artifact@v8
              continue-on-error: true
              with:
                  pattern: pr-healer-{agent,verify}-*
                  path: ${{ runner.temp }}/healer-data
                  merge-multiple: true

            - name: Combine the verified fixes and open the PR
              id: open
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  HEALER_DATA_DIR: ${{ runner.temp }}/healer-data
                  FIX_MATRIX: ${{ needs.plan-fixes.outputs.fix_matrix }}
                  VERIFY_REPEAT: ${{ inputs.verify_repeat }}
                  PR_NUMBER: ${{ inputs.pr_number }}
                  PR_URL: ${{ needs.resolve-input.outputs.pr_url }}
                  SOURCE_RUN_URL: ${{ needs.collect.outputs.source_run_url }}
                  HEALER_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
                  JIRA_KEY: ${{ inputs.jira_parent_key }}
                  ASSIGNEE: ${{ vars.NIGHTLY_HEALER_PR_ASSIGNEE }}
              run: |
                  mkdir -p "$HEALER_DATA_DIR"
                  node "$HEALER_DIR/scripts/open-pr-fix-pr.js"

            - uses: actions/upload-artifact@v7
              if: always()
              with:
                  name: pr-healer-fixes
                  path: ${{ runner.temp }}/healer-data/fixes.json
                  if-no-files-found: ignore
                  retention-days: 7

    report:
        name: Report
        needs:
            [
                resolve-input,
                collect,
                prepare-builds,
                rerun-on-pr,
                rerun-on-main,
                plan-fixes,
                fix-agent,
                verify-fix,
                open-fix-pr,
            ]
        if: always() && needs.resolve-input.result == 'success'
        runs-on: ubuntu-22.04
        permissions:
            contents: read
            pull-requests: write
        steps:
            - name: Check out the healer
              uses: actions/checkout@v6
              with:
                  repository: ${{ job.workflow_repository }}
                  ref: ${{ job.workflow_sha }}
                  path: .healer
                  sparse-checkout: actions/playwright-test-healer
                  persist-credentials: false
            - uses: actions/setup-node@v6
              with:
                  node-version: ${{ env.HEALER_NODE_VERSION }}

            - uses: actions/download-artifact@v8
              continue-on-error: true
              with:
                  pattern: pr-healer-{triage,rerun-pr,rerun-main,fix-skips,fixes}
                  path: ${{ runner.temp }}/healer-data
                  merge-multiple: true

            - name: Resolve the state
              id: state
              env:
                  INPUT_STATE: ${{ needs.resolve-input.outputs.state }}
                  COLLECT_RESULT: ${{ needs.collect.result }}
                  FOUND: ${{ needs.collect.outputs.found }}
              run: |
                  if [ -n "$INPUT_STATE" ]; then
                    STATE="$INPUT_STATE"
                  elif [ "$COLLECT_RESULT" != "success" ]; then
                    STATE="error"
                  elif [ "$FOUND" != "true" ]; then
                    STATE="no-run"
                  else
                    STATE="ok"
                  fi
                  echo "state=$STATE" >> "$GITHUB_OUTPUT"

            - name: Write the report
              id: report
              env:
                  HEALER_STATE: ${{ steps.state.outputs.state }}
                  HEALER_DATA_DIR: ${{ runner.temp }}/healer-data
                  COMMENT_PATH: ${{ runner.temp }}/comment.md
                  SLACK_PAYLOAD_PATH: ${{ runner.temp }}/slack-payload.json
                  OVER_LIMIT: ${{ needs.collect.outputs.over_limit }}
                  RERUN_LIMIT: ${{ inputs.max_reruns }}
                  PR_RERUN_RESULT: ${{ needs.rerun-on-pr.result }}
                  MAIN_RERUN_RESULT: ${{ needs.rerun-on-main.result }}
                  PR_NUMBER: ${{ inputs.pr_number }}
                  PR_URL: ${{ needs.resolve-input.outputs.pr_url }}
                  PR_HEAD_SHA: ${{ needs.resolve-input.outputs.head_sha }}
                  PR_BASE_SHA: ${{ needs.resolve-input.outputs.base_sha }}
                  SOURCE_RUN_URL: ${{ needs.collect.outputs.source_run_url }}
                  HEALER_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
                  FIX_PR_URL: ${{ needs.open-fix-pr.outputs.fix_pr_url }}
                  HEAL_LABEL: ${{ inputs.label }}
              run: |
                  node "$HEALER_DIR/scripts/pr-healer-report.js" report
                  cat "$COMMENT_PATH" >> "$GITHUB_STEP_SUMMARY"

            # One comment per PR, replaced on every run.
            - name: Post the comment on the PR
              continue-on-error: true
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  PR_NUMBER: ${{ inputs.pr_number }}
                  COMMENT_PATH: ${{ runner.temp }}/comment.md
              run: |
                  set -euo pipefail
                  MARKER=$(head -1 "$COMMENT_PATH")
                  COMMENT_ID=$(gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments?per_page=100" --paginate \
                    --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"${MARKER}\"))) | .id" | tail -1)

                  if [ -n "$COMMENT_ID" ]; then
                    gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${COMMENT_ID}" -F "body=@${COMMENT_PATH}" --silent
                  else
                    gh api "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -F "body=@${COMMENT_PATH}" --silent
                  fi

            # Removing the label lets the next "add the label" start a fresh run.
            - name: Remove the label
              continue-on-error: true
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  PR_NUMBER: ${{ inputs.pr_number }}
                  LABEL: ${{ inputs.label }}
              run: |
                  ENCODED=$(jq -rn --arg label "$LABEL" '$label | @uri')
                  gh api -X DELETE "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels/${ENCODED}" --silent

            - name: Prepare the Slack message
              id: slack-payload
              if: inputs.slack_channel != '' && steps.report.outputs.has_slack_payload == 'true'
              env:
                  SLACK_CHANNEL: ${{ inputs.slack_channel }}
                  FILE: ${{ runner.temp }}/slack-payload.json
              run: |
                  set -euo pipefail
                  jq --arg channel "$SLACK_CHANNEL" '. + {channel: $channel}' "$FILE" > "$FILE.tmp"
                  mv "$FILE.tmp" "$FILE"
                  echo "file=$FILE" >> "$GITHUB_OUTPUT"

            - name: Notify Slack
              if: steps.slack-payload.outcome == 'success'
              continue-on-error: true
              uses: slackapi/slack-github-action@0d95c9a7becc1e6e297d76df9bc735c44f4cbcbc # v3
              with:
                  method: chat.postMessage
                  errors: true
                  token: ${{ secrets.SLACK_TOKEN }}
                  payload-file-path: ${{ steps.slack-payload.outputs.file }}
